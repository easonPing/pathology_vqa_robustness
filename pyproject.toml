[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-vqa-exp2"
version = "0.1.0"
description = "Controlled perturbation evaluation for SlideBench-VQA"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0",
  "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]
